openapi: 3.1.0
info:
  title: admin-template API
  version: 0.0.0
tags:
  - name: users
security:
  - bearerAuth: []
paths:
  /users:
    get:
      operationId: listUsers
      tags:
        - users
      x-permission: users.read
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
        - in: query
          name: order
          schema:
            type: string
            enum:
              - ASC
              - DESC
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  error:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  total:
                    type: number
                required:
                  - code
                  - msg
                  - error
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../../shared/openapi/common.yaml#/components/schemas/ErrorBody
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        phone_number:
          type: string
          pattern: ^[0-9]{10}$
          minLength: 1
        address:
          type: string
          minLength: 1
        remark:
          type: string
        role:
          type: string
          enum:
            - guest
            - user
            - premium
            - partner
            - support
            - admin
            - superadmin
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - user_id
        - email
        - first_name
        - last_name
        - phone_number
        - address
        - remark
        - role
        - created_at
        - updated_at
